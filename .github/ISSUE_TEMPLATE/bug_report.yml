name: Bug report
description: Signaler un bug
title: "[Bug] "
labels:
  - type:bug
  - status:ready
body:
  - type: textarea
    id: description
    attributes:
      label: Problème
      description: Décris le bug en quelques phrases.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      placeholder: |
        1. Aller sur...
        2. Faire...
        3. Constater...

  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu

  - type: textarea
    id: actual
    attributes:
      label: Résultat obtenu

  - type: textarea
    id: context
    attributes:
      label: Notes utiles
      placeholder: Logs, environnement, capture, hypothèse...
