name: Backend task
description: Créer une tâche backend simple
title: "[Domaine] "
labels:
  - area:backend
body:
  - type: textarea
    id: objective
    attributes:
      label: Objectif
      description: Décris ce qui doit changer et pourquoi.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: À faire
      placeholder: |
        -
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Validation
      placeholder: |
        - npm run lint
        - npm run test
        - npm run build

  - type: textarea
    id: notes
    attributes:
      label: Notes / hors périmètre
      placeholder: |
        - Hors périmètre :
        - Contexte :
