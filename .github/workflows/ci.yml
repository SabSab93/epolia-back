name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  checks:
    name: Install, lint, test and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/epolia?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/epolia?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
